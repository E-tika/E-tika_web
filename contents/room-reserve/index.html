<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>購読室予約 - 経済学部同好会</title>
    <link rel="icon" href="../../images/banana.png" type="image/png">
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="navbar">
        <div class="nav-logo">
            <a href="../../index.html">
                <img src="../../images/banana.png" alt="ロゴ" class="logo-img"> 
                <span>京都大学経済学部同好会</span>
            </a>
        </div>
        <nav class="nav-links">
            <a href="../sawakai/index.html">茶話会</a>
            <a href="index.html">購読室予約</a>
            <a href="../past-exam/index.html">期末試験過去問</a>
            <a href="../printer-reserve/index.html">印刷室</a>
            <a href="../seminar-info/index.html">ゼミ紹介</a>
            <a href="../contact/index.html">お問い合わせ</a>
        </nav>
    </header>

    <main class="container">

    <div class="archive-header">
        <h1>購読室利用予約</h1>
        <div class="notice-box">
            <h4>注意事項:</h4>
            <ul>
                    <li>重複予約は先の予約を優先します。</li>
                    <li>30日後以内の予約のみを承っております。</li>
                    <li>空予約防止のため、不要になった予約はキャンセルしてください。</li>
                    <li>土・日・祝日は、法経本館が閉鎖されている可能性が高いため、ご利用いただけません。</li>
            </ul>
        </div>
    </div>

    <div class="reservation-system">
        <div class="calendar-sidebar">
            <h3>購読室の予約状況</h3>
            <p id="selected-date-display" class="date-badge">選択した日付: ----/--/--</p>
            <input type="date" id="date-picker" class="custom-date-input">
            
            <a href="https://forms.gle/bBuJm15HAuyzfCzT8" target="_blank" class="reserve-button">
                🗓️ 予約フォームを開く
            </a>

            <div id="cancel-form">
                <h3>予約の取り消し</h3>
                <input type="text" id="cancelCodeInput" placeholder="予約番号（例: A7K39P2X）" maxlength="8">
                <button id="cancelBtn">予約を取り消す</button>
                <p id="cancelMessage"></p>
            </div>

        </div>

        <div class="timetable-area">
            <div id="timetable-container">
                <p>日付を選択してください。</p>
            </div>
        </div>
    </div>
    </main>

    <script src="reserve.js"></script>
    <footer class="main-footer">
    <p>&copy; 2026 経済学部同好会常任委員会</p>
    <p class="version-info">ver. 2.0.0</p>
</footer>
</body>
</html>
